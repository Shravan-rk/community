      <h1>ನೀವು ಆಫ್‌ಲೈನ್‌ನಲ್ಲಿದ್ದೀರಿ</h1>
      <p>ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಸಿಗುತ್ತಿಲ್ಲ. ನೀವು ಹಿಂದೆ ನೋಡಿದ ಯೋಜನೆಗಳ ವಿವರಗಳು ಸಾಧ್ಯವಾದರೆ ತೋರಿಸಲ್ಪಡುತ್ತವೆ.</p>
      <p>ಸಂಪರ್ಕ ಸಿಕ್ಕ ನಂತರ ಪುನಃ ಪ್ರಯತ್ನಿಸಿ. ಯೋಜನೆಗಳ ಅಧಿಕೃತ ಮಾಹಿತಿಗಾಗಿ ಸರ್ಕಾರಿ ಮೂಲವನ್ನು ಮಾತ್ರ ಅವಲಂಬಿಸಿ.</p>
      <p><a href="/">ಮುಖಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ</a></p>
